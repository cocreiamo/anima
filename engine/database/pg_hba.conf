# The superuser reaches the server only through the local socket, as the
# operating-system user of the same name; it has no password (R12).
# The secret store's storage role: only its own database, only by the peer
# credentials of its own operating-system user (mapped in pg_ident.conf).
# Everything else is refused until the access rules exist (fail closed).
local all           postgres          peer
local secrets_store svc_secrets_store peer map=secrets_store
local all           all               reject
host  all           all     all       reject
