name: Promote

# Verifies the newest commit of main with every suite, builds the engine image
# and passes the system tests on it, moves main-green to that commit, and
# releases the version that commit carries: the image that was built and tested
# here is the one published, by digest, never rebuilt
# (`anima-branching-and-releasing`).

on:
  schedule:
    - cron: "7 2 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: promote
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-26.04
    timeout-minutes: 180
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
      version: ${{ steps.release.outputs.version }}
      publish: ${{ steps.release.outputs.publish }}
      image-id: ${{ steps.archive.outputs.image-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          submodules: true
          persist-credentials: false
      - id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          version: 2026.11.10
      - id: pilot
        run: echo "sha256=$(sed -n 's/^SYSML_PILOT_SHA256 = "\(.*\)"$/\1/p' mise.toml)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/sysml-pilot
          key: sysml-pilot-${{ steps.pilot.outputs.sha256 }}
      # Every check, then the engine image built cold (no image is restored from
      # a cache here) and the system tests run on it.
      - run: mise run promote:verify
      - id: release
        name: Decide whether this commit carries a version to publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(jq -r '."."' .github/release-please-manifest.json)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$version" = "0.0.0" ]; then
            echo "No version prepared yet: nothing to publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          elif gh release view "v$version" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "v$version is already released: nothing to publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - id: archive
        name: Archive the image that passed
        if: steps.release.outputs.publish == 'true'
        run: |
          podman save --output "$RUNNER_TEMP/engine-image.tar" "$(cat .cache/engine/engine.ref)"
          echo "image-id=$(cat .cache/engine/engine.id)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.release.outputs.publish == 'true'
        with:
          name: engine-image
          path: ${{ runner.temp }}/engine-image.tar
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: engine-logs
          path: .cache/engine/logs
          if-no-files-found: ignore

  publish:
    needs: verify
    if: needs.verify.outputs.publish == 'true'
    runs-on: ubuntu-26.04
    permissions:
      packages: write
    outputs:
      reference: ${{ steps.push.outputs.reference }}
      existing: ${{ steps.push.outputs.existing }}
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      IMAGE_ID: ${{ needs.verify.outputs.image-id }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: engine-image
          path: ${{ runner.temp }}/image
      - id: load
        name: Load the archive and check that it is the image that passed
        run: |
          ref="$(podman load --quiet --input "$RUNNER_TEMP/image/engine-image.tar" | tail -n 1)"
          actual="$(podman image inspect --format '{{.Id}}' "$ref")"
          if [ "$actual" != "$IMAGE_ID" ]; then
            echo "The archive holds $actual, not the image that passed ($IMAGE_ID)." >&2
            exit 1
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
      - id: push
        name: Push the image under its version
        env:
          REGISTRY_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
          REF: ${{ steps.load.outputs.ref }}
        run: |
          echo "$REGISTRY_TOKEN" | podman login ghcr.io --username "$ACTOR" --password-stdin
          if podman manifest inspect "docker://ghcr.io/cocreiamo/anima:$VERSION" >/dev/null 2>&1; then
            # An earlier run pushed the tag and failed before the release: the tag
            # is never moved; the release points at the digest it already holds.
            echo "ghcr.io/cocreiamo/anima:$VERSION exists: not pushed again."
            podman pull --quiet "docker://ghcr.io/cocreiamo/anima:$VERSION" >/dev/null
            digest="$(podman image inspect --format '{{.Digest}}' "ghcr.io/cocreiamo/anima:$VERSION")"
            echo "reference=ghcr.io/cocreiamo/anima@$digest" >> "$GITHUB_OUTPUT"
            echo "existing=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          podman push --digestfile "$RUNNER_TEMP/digest" "$REF" "docker://ghcr.io/cocreiamo/anima:$VERSION"
          echo "reference=ghcr.io/cocreiamo/anima@$(cat "$RUNNER_TEMP/digest")" >> "$GITHUB_OUTPUT"

  promote:
    needs: [verify, publish]
    if: ${{ !cancelled() && needs.verify.result == 'success' && (needs.publish.result == 'success' || needs.publish.result == 'skipped') }}
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      SHA: ${{ needs.verify.outputs.sha }}
      IMAGE: ${{ needs.publish.outputs.reference }}
      EXISTING: ${{ needs.publish.outputs.existing }}
    steps:
      - name: Fast-forward main-green
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main-green" --silent 2>/dev/null; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/heads/main-green" \
              -f sha="$SHA" -F force=false --silent
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref=refs/heads/main-green -f sha="$SHA" --silent
          fi
      - name: Release the version this commit carries
        run: |
          version="$(gh api "repos/$GITHUB_REPOSITORY/contents/.github/release-please-manifest.json?ref=$SHA" \
            --jq '.content' | base64 --decode | jq -r '."."')"
          if [ "$version" = "0.0.0" ]; then
            echo "No version prepared yet."
          elif gh release view "v$version" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "v$version is already released."
          elif [ -n "$IMAGE" ]; then
            notes="Engine image: \`$IMAGE\`"
            if [ "$EXISTING" = "true" ]; then
              notes="$notes (published by an earlier run; the tag already existed and was not moved, this run's build was not pushed)"
            fi
            gh release create "v$version" --repo "$GITHUB_REPOSITORY" \
              --target "$SHA" --generate-notes --notes "$notes"
          else
            echo "v$version has no published image: not releasing it." >&2
            exit 1
          fi
