name: Prepare release

# Prepares the next version on main: release-please keeps a pull request with
# the version and the changelog. It releases nothing: the tag and the GitHub
# release are created by the Promote workflow when that commit reaches
# main-green (`anima-branching-and-releasing`).

on:
  push:
    branches: [main]

permissions: {}

jobs:
  release-please:
    runs-on: ubuntu-24.04
    # The pull request is opened and updated with an installation token of the
    # organization's bot App, not with the workflow's token: a pull request
    # opened with the workflow's token starts no checks. The workflow's own
    # token is given no permission.
    permissions: {}
    steps:
      - id: app-token
        name: Obtain the installation token of the bot App
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: .github/release-please-config.json
          manifest-file: .github/release-please-manifest.json
          skip-github-release: true
