# Components shipped in Anima: the single list of what is adopted, at which
# exact version, and under which licence. tests/repository/test_repository.py checks it.
#
# A component built from source is a git submodule pinned by commit.
# A component whose fork is not yet a submodule is pinned by the commit of its
# release. A component consumed as an image is pinned by digest.
#
# Every entry with an `image` also has a `mirror`: the package of the
# organization's mirror (`ghcr.io/cocreiamo/anima-mirror/<name>`) that holds the
# same image under the same digest, copied by `.github/workflows/mirror-base-images.yml`
# because the upstream registries delete the manifest of a digest (GAP-060). The
# builds still pull from `image`; they move to `mirror` in a later change.

[policy]
# SPDX identifiers a shipped component may declare. Adding one is a decision.
allowed_licenses = [
  "AGPL-3.0-only",
  "Apache-2.0",
  "MIT",
  "MPL-2.0",
  "PostgreSQL",
  # A distribution image whose packages carry their own licences; see its entry.
  "LicenseRef-Fedora-Distribution",
  # The same kind of reference for the base images of the inner images (see
  # their entries). The founder confirmed on 2026-11-27 that the three below
  # are allowed, because the engine's container files use these bases.
  "LicenseRef-Debian-Distribution",
  "LicenseRef-UBI-Distribution",
  "LicenseRef-Alpine-Distribution",
]

