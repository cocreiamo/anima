native = "none"

[proposal_note]
host_oneshots = "the five shell one-shots on the engine's operating system (anima-config, anima-credentials, anima-listen-*, secrets-root-of-trust, entry-certificate) peak at 10 MiB or less and stay under the systemd default task limit; they get no envelope of their own"

[proposal_total]
long_running_ceiling_mib = 3392
long_running_ceiling_with_mail_mib = 3520
at_start_ceiling_mib = 3904
operating_system_allowance_mib = 256
engine_ceiling_mib = 4160
engine_ceiling_with_mail_mib = 4288
measured_peak_mib = 3252
measured_steady_mib = 1071
reading = "the ceiling is what a limit of the engine as a whole must allow: long-running units 2048 + 768 + 256 + 256 + 64, plus the configurator's 512 which runs at the same time, plus 256 for systemd, podman and the rest of the operating system; the measured peak was above the steady use because the identity provider's heap was unbounded"

[adopter_4_gb]
# What an adopter with a machine of 4 GB (about 3.8 GiB usable) changes: the
# defaults above sum to 4160 MiB and do not fit beside a host operating system.
change = { access_memory_mib = 1536, database_memory_mib = 512, mail = "off (the default driver is the organisation's mail service)" }
engine_ceiling_mib = 3392
basis = "access: not below upstream's formula of 1360 MB for a small instance; database: 512 MiB keeps shared_buffers and 100 connections; the ceiling is 1536 + 512 + 256 + 256 + 64 + 512 (configure) + 256 (system)"
not_supported = "a machine of 2 GB: the identity provider's documented least is 750 MB and the configurator needs 300 MiB at start"
