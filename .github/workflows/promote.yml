name: Promote

# Verifies the newest commit of main with every suite, builds the engine image
# and passes the system tests on it, moves main-green to that commit, and
# releases the version that commit carries: the image that was built and tested
# here is the one published, by digest, never rebuilt
# (`anima-branching-and-releasing`).
#
# Every step that does something is one call to a command of the repository
# (`mise run promote:<name>`, `mise-tasks/promote/`), which is tested against
# real podman and a real registry (`mise run promote:test`, R115, R170, R171):
# this file holds the checkout, the tools, the registry login, the passing of
# inputs and outputs, and the artifact transfer.

on:
  schedule:
    - cron: "7 2 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: promote
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.commit.outputs.commit }}
      version: ${{ steps.release.outputs.version }}
      publish: ${{ steps.release.outputs.publish }}
      image-id: ${{ steps.archive.outputs.image-id }}
    steps:
      - id: commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          submodules: true
          persist-credentials: false
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          version: 2026.11.14
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/sysml-pilot
          key: sysml-pilot-${{ hashFiles('mise.toml') }}
      # Every check, then the engine image built cold (no image is restored from
      # a cache here) and the system tests run on it.
      - run: mise run promote:verify
      - id: release
        name: Decide whether this commit carries a version to publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: mise run --quiet promote:plan >> "$GITHUB_OUTPUT"
      - id: archive
        name: Archive the image that passed
        if: steps.release.outputs.publish == 'true'
        run: mise run --quiet promote:archive "$RUNNER_TEMP/engine-image.tar" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.release.outputs.publish == 'true'
        with:
          name: engine-image
          path: ${{ runner.temp }}/engine-image.tar
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: engine-logs
          path: .cache/engine/logs
          if-no-files-found: ignore

  publish:
    needs: verify
    if: needs.verify.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      reference: ${{ steps.push.outputs.reference }}
      existing: ${{ steps.push.outputs.existing }}
    env:
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      # The repository at the commit that was verified: only for its commands.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.sha }}
          persist-credentials: false
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          version: 2026.11.14
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: engine-image
          path: ${{ runner.temp }}/image
      - id: load
        name: Load the archive and check that it is the image that passed
        env:
          IMAGE_ID: ${{ needs.verify.outputs.image-id }}
        run: mise run --quiet promote:load "$RUNNER_TEMP/image/engine-image.tar" "$IMAGE_ID" >> "$GITHUB_OUTPUT"
      - name: Log in to the registry
        env:
          REGISTRY_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: echo "$REGISTRY_TOKEN" | podman login ghcr.io --username "$ACTOR" --password-stdin
      - id: push
        name: Push the image under its version
        env:
          REF: ${{ steps.load.outputs.ref }}
        run: mise run --quiet promote:publish >> "$GITHUB_OUTPUT"

  promote:
    needs: [verify, publish]
    if: ${{ !cancelled() && needs.verify.result == 'success' && (needs.publish.result == 'success' || needs.publish.result == 'skipped') }}
    runs-on: ubuntu-24.04
    # The workflow's own token only reads here: moving main-green and creating
    # the release use the installation token of the promote App, which the
    # ruleset of main-green lets move the branch, and which no other job gets.
    permissions:
      contents: read
    env:
      SHA: ${{ needs.verify.outputs.sha }}
      IMAGE: ${{ needs.publish.outputs.reference }}
      EXISTING: ${{ needs.publish.outputs.existing }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.sha }}
          persist-credentials: false
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          version: 2026.11.14
      - id: app-token
        name: Obtain the installation token of the promote App
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          app-id: ${{ vars.PROMOTE_APP_ID }}
          private-key: ${{ secrets.PROMOTE_APP_PRIVATE_KEY }}
          permission-contents: write
      - name: Fast-forward main-green
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: mise run --quiet promote:green "$SHA"
      - name: Release the version this commit carries
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: mise run --quiet promote:release "$SHA"
