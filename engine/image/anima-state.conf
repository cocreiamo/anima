# State lives in the database server's volume only. The root of trust is kept
# apart from it (a restore elsewhere needs the same root of trust, R20).
d /var/lib/anima 0755 root root -
d /var/lib/anima/database 0700 root root -
d /var/lib/anima/root-of-trust 0700 root root -
# The local socket directory shared by the database server and the secret store.
d /run/anima 0755 root root -
d /run/anima/pgsocket 0755 999 999 -
d /run/anima/pgtls 0750 999 999 -
# The HTTP entry point's certificate and key, in memory, owned by its user.
d /run/anima/entrytls 0750 1011 1011 -
d /run/anima/listen 0755 root root -
d /run/anima/config 0755 root root -
d /run/anima/configurator 0750 root root -
