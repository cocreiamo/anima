name: Pull request

# Both jobs are required checks, so they must also report in the merge queue,
# where there is no pull request to look at: there they succeed without work.

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
  merge_group:

permissions: {}

jobs:
  title:
    name: Conventional Commits title
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: read
    steps:
      - if: github.event_name == 'pull_request'
        uses: amannn/action-semantic-pull-request@66e72920af32222769c386d81f89656ebcb6d6d5 # v6.1.4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependencies:
    name: Dependency review
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
