# The configurator and its three providers (ADR 0006). Each is a fork of ours
# (cocreiamo/anima-opentofu and the three anima-terraform-provider-* forks) that
# is not yet a submodule. Until it is, the entry is pinned by the commit of the
# upstream release tag, looked up with `gh api repos/<owner>/<repo>/commits/<tag>
# --jq .sha`; the `submodule` field is added with the fork. They are fetched
# and built from this commit, never by a floating reference.
[[component]]
name = "opentofu"
role = "adapter: configurator, the one that applies all declared state (part of the engine)"
version = "1.13.10"
license = "MPL-2.0"
upstream = "https://github.com/opentofu/opentofu"
commit = "4dcfb2efaaf7d3e95a92d1c10b7fd000e82bc51f"

# The binary of the configurator is taken from the project's official image
# (minimal variant) and copied into a small base, because that image refuses to
# be a base image (GAP-030, closed). The source of the same release is the
# `opentofu` entry above; the digest here pins the image the binary comes from.
[[component]]
name = "opentofu-image"
role = "binary of the configurator: copied from the official image into the configurator's image"
version = "1.13.10-minimal"
license = "MPL-2.0"
upstream = "https://github.com/opentofu/opentofu"
image = "ghcr.io/opentofu/opentofu"
digest = "sha256:5c6cef27227e50060139fec7122c83d14088b5dd2677162545f0e699e1f6196c"
mirror = "ghcr.io/cocreiamo/anima-mirror/opentofu-image"

[[component]]
name = "terraform-provider-postgresql"
role = "provider of the configurator: the database server's roles, privileges and extensions"
version = "1.27.0"
license = "MPL-2.0"
upstream = "https://github.com/cyrilgdn/terraform-provider-postgresql"
commit = "ff936b9548c1076f498523a2bd116915ff977142"

[[component]]
name = "terraform-provider-vault"
role = "provider of the configurator: the secret store, used against the secret store's compatible API"
version = "5.14.0"
license = "MPL-2.0"
upstream = "https://github.com/hashicorp/terraform-provider-vault"
commit = "137fcd197d87b0eed92405b709a3bc13d2b4090f"

[[component]]
name = "terraform-provider-keycloak"
role = "provider of the configurator: the token issuer's realm, roles, scopes, clients and users"
version = "5.11.0"
license = "Apache-2.0"
upstream = "https://github.com/keycloak/terraform-provider-keycloak"
commit = "2ca2e76f85424e6bc68e76b14df56dd99f98b4ac"

# Fedora bootc is a distribution image: a collection of packages, each with its
# own licence (GPL, LGPL, MIT, Apache-2.0 and others, among them systemd, podman
# and the kernel). No single SPDX identifier is true of it, and naming one (MIT
# is the licence of Fedora's own packaging) would claim more than it says. It is
# therefore declared with a LicenseRef, listed in `policy.allowed_licenses`: the
# licence of each package is the one the package declares, and it is recorded in
# the image's software bill of materials (R16). The founder confirmed on
# 2026-11-27 that this LicenseRef is an allowed licence for the base image of
# the engine (`anima-licensing-and-brand`, ADR 0005).
# Tags move: the 45 tag is rebuilt every day, which is why the digest is the pin.
[[component]]
name = "fedora-bootc"
role = "base of the engine image: operating system, systemd, container runtime"
version = "45"
license = "LicenseRef-Fedora-Distribution"
upstream = "https://gitlab.com/fedora/bootc/base-images"
image = "quay.io/fedora/fedora-bootc"
digest = "sha256:27650ded85a0319c30d8978a1c10c89084de07fbbb125f85bb054910be081244"
mirror = "ghcr.io/cocreiamo/anima-mirror/fedora-bootc"

# The base images of the inner images of the engine: each is the first line of a
# container file under engine/. Each is a distribution image, a collection of
# packages with their own licences, so each is declared with a LicenseRef like
# the base of the engine image, and the licence of each package is the one the
# package declares. The founder confirmed on 2026-11-27 that the three
# references added for them (Debian, UBI, Alpine) are allowed licences
# (`anima-licensing-and-brand`). Tags move, so the digest is the pin.
[[component]]
name = "debian"
role = "base of the database server's image: operating system of the inner container"
version = "trixie-slim"
license = "LicenseRef-Debian-Distribution"
upstream = "https://github.com/debuerreotype/docker-debian-artifacts"
image = "docker.io/library/debian"
digest = "sha256:8aa5a7bf5a1955bddbe7d74fcdd0b91ab30e74362a8b73af672b0481b35b44a0"
mirror = "ghcr.io/cocreiamo/anima-mirror/debian"

[[component]]
name = "ubi9"
role = "base of the identity provider's image: the stage that installs its packages (the upstream container file's own base)"
version = "9.9-1795197514"
license = "LicenseRef-UBI-Distribution"
upstream = "https://registry.access.redhat.com/ubi9"
image = "registry.access.redhat.com/ubi9"
digest = "sha256:6636b79fba9e5044360366f189333c30b5ce528efd92c40c68b074592b971fcd"
mirror = "ghcr.io/cocreiamo/anima-mirror/ubi9"

[[component]]
name = "ubi9-micro"
role = "base of the identity provider's image: the final stage (the upstream container file's own base)"
version = "9.9-1794478307"
license = "LicenseRef-UBI-Distribution"
upstream = "https://registry.access.redhat.com/ubi9-micro"
image = "registry.access.redhat.com/ubi9-micro"
digest = "sha256:dbd325b96bcd432dd42816d31412bdf1dc0fb973b79ed310344bc23c76c068db"
mirror = "ghcr.io/cocreiamo/anima-mirror/ubi9-micro"

[[component]]
name = "alpine"
role = "base of the secret store's image (the upstream container file's own base) and of the configurator's image"
version = "3.24.4"
license = "LicenseRef-Alpine-Distribution"
upstream = "https://github.com/alpinelinux/docker-alpine"
image = "docker.io/library/alpine"
digest = "sha256:f59abe656b692d901e184be3445e084786602108599d2a51d229c0f5a48c71bf"
mirror = "ghcr.io/cocreiamo/anima-mirror/alpine"

# The mail catcher: the stand-in of the outgoing mail port, for local
# development and CI. Our fork is cocreiamo/anima-mailpit, not yet a submodule,
# so it is pinned by the commit of the upstream release tag, looked up with
# `gh api repos/axllent/mailpit/commits/<tag> --jq .sha`. Unverified: the
# release was chosen as the latest at the time of writing, not by the engine's
# builder.
[[component]]
name = "mailpit"
role = "adapter: outgoing mail (stand-in, local development and CI only)"
version = "1.34.0"
license = "MIT"
upstream = "https://github.com/axllent/mailpit"
commit = "55a301791fed4c757850bf7afb9672a1dace30bb"

# The image of the same release, which the engine's mail container file starts
# from until the fork is built from source: it holds the one program of the
# release.
[[component]]
name = "mailpit-image"
role = "stand-in of outgoing mail: the upstream image the engine's mail unit is built from"
version = "v1.34.0"
license = "MIT"
upstream = "https://github.com/axllent/mailpit"
image = "docker.io/axllent/mailpit"
digest = "sha256:23a2ef85bc50853ab3093645d1d64679afd8887e89da5e48a88940c172591a4e"
mirror = "ghcr.io/cocreiamo/anima-mirror/mailpit-image"

# The HTTP entry point (ADR 0008). Two entries, both recorded as exceptions to
# building from source in a fork (GAP-057), pinned the way a fork that is not yet
# a submodule is: by the commit of the upstream release tag, looked up with
# `gh api repos/<owner>/<repo>/commits/<tag> --jq .sha`.
#
# The runtime and SDK of the host program come from a distribution's packages
# (the distribution builds .NET from source), not from a fork of ours. The
# commit is the release tag of the source that the package version is built
# from. Unverified: that the distribution's package of this version is built
# from exactly this tag; and the package's own pin, the digest of the
# distribution image that the entry's container file starts from, is added with
# that container file (TASK-86), because no image has been chosen and
# digested yet.
[[component]]
name = "dotnet"
role = "runtime and SDK of the entry's host program: the distribution's packages, built by it from source (not a fork of ours)"
version = "10.0.15"
license = "MIT"
upstream = "https://github.com/dotnet/dotnet"
commit = "8e0f8ed2312954727f8919d7d1c2f78b483b4ee7"

# The library that forwards requests. Pinned by version and by the content hash
# of the package, which is the SHA-256 of the file
# https://api.nuget.org/v3-flatcontainer/yarp.reverseproxy/2.3.0/yarp.reverseproxy.2.3.0.nupkg
# measured on 2026-11-28; the commit is the release tag of its source. A mirror
# fork for upstream contributions is planned (GAP-057), and its governance is a
# risk (GAP-059).
[[component]]
name = "yarp"
role = "adapter: HTTP entry point (the library that forwards requests, hosted by the entry's own program, part of the engine)"
version = "2.3.0"
license = "MIT"
upstream = "https://github.com/dotnet/yarp"
commit = "4154b6d1eaa0712597e3482f817b400b55268cae"
package = "Yarp.ReverseProxy"
package_sha256 = "ff12ef5f9c46c3f3e815575a45b7598c68043b9eb101a9aab18ed3bd8c025a24"

# ---- Images used only by tools, tests and builds: not shipped ----------------
#
# An image that a tool, a test or a build stage starts, and that is not part of
# what Anima ships (for example the helper image of a test library, or the
# stage that compiles a program and is then discarded), is declared here, apart
# from the components above, with the same fields and as an array
# `[[tool_image]]`. It is pinned by digest like every image (`anima-repository-conventions`, R11), and
# the Renovate manager of .github/renovate.json updates it like the others.
# Its licence is not checked against `policy.allowed_licenses`: nothing of it
# ships. The licence stated is that of the program the image exists for.
[[tool_image]]
name = "eclipse-temurin"
role = "build stage of the identity provider's image: the Java toolchain that compiles it"
version = "21-jdk"
license = "GPL-2.0-only WITH Classpath-exception-2.0"
upstream = "https://github.com/adoptium/containers"
image = "docker.io/library/eclipse-temurin"
digest = "sha256:8ad118b146aa92da815b576441acd6b42b38236797ad0b6edc8c200b85bb0734"
mirror = "ghcr.io/cocreiamo/anima-mirror/eclipse-temurin"

[[tool_image]]
name = "golang"
role = "build stage of the secret store's image: the Go toolchain that compiles it"
version = "1.27"
license = "BSD-3-Clause"
upstream = "https://github.com/docker-library/golang"
image = "docker.io/library/golang"
digest = "sha256:5f1b98fa02fe396ebce2a0227a0e08309e11792915b9dd2e1f71053d7e7e6666"
mirror = "ghcr.io/cocreiamo/anima-mirror/golang"

# The tool that copies the images above into the mirror. The mirror workflow
# (`.github/workflows/mirror-base-images.yml`) runs it with podman and takes
# this entry's reference from here, so that it is pinned and updated like every
# image.
[[tool_image]]
name = "skopeo"
role = "tool of the mirror workflow: copies an image between registries and keeps its digest"
version = "v1.25.1"
license = "Apache-2.0"
upstream = "https://github.com/containers/skopeo"
image = "quay.io/skopeo/stable"
digest = "sha256:9ce297b1309340cb31cf4cd7529a638b912da0bbe30894e210dbf9aae9d8a5d5"
mirror = "ghcr.io/cocreiamo/anima-mirror/skopeo"

# The registry that the integration tests of the commands that the workflows call
# (`tests/ci/`) start on the machine, so that the copy into the mirror runs for
# real against a registry that nothing else uses.
[[tool_image]]
name = "scratch-store"
role = "throwaway store of images for the integration tests of the commands that the workflows call"
version = "3.0.0"
license = "Apache-2.0"
upstream = "https://github.com/distribution/distribution"
image = "ghcr.io/distribution/distribution"
digest = "sha256:4ba3adf47f5c866e9a29288c758c5328ef03396cb8f5f6454463655fa8bc83e2"
mirror = "ghcr.io/cocreiamo/anima-mirror/scratch-store"
