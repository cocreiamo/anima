[project]
name = "anima-verification"
version = "0.0.1"
description = "Automated verifications of the Anima requirements model"
requires-python = "==3.15.*"
dependencies = []

[dependency-groups]
dev = ["pytest", "pyyaml==6.0.4", "testcontainers==4.15.0"]

[tool.uv]
package = false

[tool.ruff]
extend-exclude = ["third_party", ".cache"]
# The generate tasks are Python scripts without an extension.
include = ["*.py", "*.pyi", "**/pyproject.toml", "mise-tasks/generate/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
cache_dir = ".cache/pytest"
