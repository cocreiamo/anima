# Inventory of what the engine runs, with what bounds each unit had before the
# envelopes, the knobs that exist for it, the measurements of a running engine
# before and after them, and the facts an adopter is told.
#
# The envelopes themselves are declared once, in engine/image/envelopes.toml (R203
# to R205); this file holds evidence about them, never a second copy of them.
# Every unit of `engine/` that has a `.container` or `.service` file has one
# `[[unit]]` entry and nothing else has (R202). Numbers are evidence of one
# measurement, dated and tied to the machine below; they are not requirements.
#
# Units of memory are mebibytes (MiB), times are seconds, a bound is a value or
# "none". How each figure was read is in `[measurement].method`.

[measurement]
date = "2026-11-28"
machine = "AMD Ryzen 7 4800H, 16 threads, 15353 MiB of memory, swap on, a shared development machine whose load average was 17 to 21 during the run (the start was slower and the identity provider's CPU time higher than on an idle machine)"
outer_podman = "4.9.3, rootless, cgroup manager systemd, cgroup v2"
engine_image = "localhost/anima/engine:a8cc809525aa, the newest local image (built the same day from another worktree, with the entry point and the mail stand-in); not rebuilt for this branch because a cold build was not needed to measure the running units"
inner = "podman 6.2.1, crun 1.31, systemd 262.1, Fedora 45 bootc; the inner podman runs as root of the engine's user namespace, services are in system.slice of the engine's own cgroup tree"
started_with = "podman run --detach --cap-add SYS_ADMIN --cap-add SYS_PTRACE with ANIMA_PROFILE=local and config/ mounted, no --memory, no --cpus; the engine was healthy after about 5 minutes (the waiting tool's 170 s limit passed once)"
method = "systemctl show -p MemoryCurrent -p MemoryPeak -p TasksCurrent -p CPUUsageNSec per unit; pids.peak and cpu.stat of the unit's cgroup; the identity provider's heap from `java -XX:+PrintFlagsFinal -version` run in its container with the flags of its command line; the outer container's cgroup for the engine total; memory current and CPU were read twice 63 s apart on the idle engine"
host_memory_seen_by_engine_mib = 15353
engine_total_memory_peak_mib = 3252
engine_total_memory_current_mib = 1071
engine_total_pids_peak_note = "outer container pids.max is 2048 (podman's default); 192 in use when read"
idle_cpu_seconds_per_63_seconds = { database = 0.32, access = 0.52, secrets = 2.35, entry = 0.26, mail = 0.21, database-tls = 0.09 }

[cgroup_delegation]
# What was found by looking inside the running engine (the main unknown).
controllers_available_to_the_engine = ["cpu", "memory", "pids"]
controllers_not_available = ["io", "cpuset"]
levels_read = "the engine's root, system.slice, each service's cgroup and each payload cgroup under it: all list cpu, memory, pids in cgroup.controllers and subtree_control; the outer container's scope on the host lists the same three"
systemd_directives = "work: `systemctl set-property --runtime entry.service MemoryMax=300M MemoryHigh=250M TasksMax=64 CPUQuota=50%` gave memory.max 314572800, memory.high 262144000, pids.max 64 and cpu.max 50000 100000 on the service's cgroup; the payload below it stayed at memory.max `max` and pids.max 2048, so a process that sizes itself from the cgroup it sees (JVM, .NET, Go) does NOT see a MemoryMax"
quadlet_keys = "work: a drop-in with `[Container] Memory=64m PidsLimit=50 PodmanArgs=--cpus=0.5` on the mail unit gave memory.max 67108864, pids.max 50 and cpu.max 50000 100000 on the payload cgroup, and the container read memory.max 67108864 from inside; the generated command line carries --memory 64m --pids-limit 50; Quadlet defaults to --cgroups=split"
defaults_today = "no unit has a memory or CPU bound; systemd gives every service TasksMax 307 and podman gives every container --pids-limit 2048"
consequence = "Memory= (and PidsLimit=) of the container unit is the knob that makes the runtimes see their limit; CPU has no Quadlet key, so a CPU bound is CPUQuota= of the service or PodmanArgs=--cpus; MemoryMax= of the service is a backstop that the runtimes do not read"
not_tested = "a limit on the outer container (`podman run --memory` of the engine as a whole) and its interaction with the inner limits; a limit lower than the working set (the kill and restart behaviour of each unit)"

# ---------------------------------------------------------------- units

[[unit]]
name = "access"
file = "engine/access/access.container"
capability = "access"
process_model = "JVM (Quarkus), long-running"
bound_today = "none (pids 2048, tasks 307 by default)"
native_knobs = [
  "JAVA_OPTS_KC_HEAP replaces the heap flags of kc.sh; its default in a container is -XX:MaxRAMPercentage=70 -XX:MinRAMPercentage=70 -XX:InitialRAMPercentage=50, and without a container limit that is 70 % of the machine's memory",
  "-XX:MaxMetaspaceSize=256m is already set by kc.sh",
  "JAVA_OPTS_APPEND for any other flag",
]
cgroup_knobs = [
  "Memory= (the JVM reads it)",
  "PidsLimit=",
  "CPUQuota= or PodmanArgs=--cpus (the JVM sizes its GC threads from the CPUs it sees)",
]
upstream_sizing = "containers guide: always set a memory limit; 750 MB is the least, 2 GB is recommended for smaller production deployments; sizing guide: base memory 1250 MB with 10000 cached sessions, 70 % of the limit is heap and about 300 MB is outside the heap, so limit = (1250 - 300) / 0.7 = 1360 MB; 1 vCPU per 15 password logins per second"
measured = { memory_current_mib = 778, memory_peak_mib = 2069, peak_is_unbounded = true, tasks_peak = 103, cpu_seconds_since_start = 109.1, note = "effective maximum heap 11274289152 bytes (10752 MiB, 70 % of the 15353 MiB it sees), initial heap 8053063680 bytes (7680 MiB); the peak is the unbounded heap growing during start, the steady use is about 800 MiB" }
measured_after = { memory_current_mib = 473, memory_peak_mib = 475, tasks_current = 41, cpu_seconds_since_start = 34.1, note = "with its envelope and the options of its unit; anon 379 MiB, the rest is the archive's page cache; before: current 778, peak 2069 with a heap bound of the host's 70 %" }

