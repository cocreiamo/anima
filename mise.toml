# Single entry point for developers and CI: `mise run <task>`.
# Every version here is exact (`anima-repository-conventions`): no ranges, no "latest".

[settings]
# mise.lock records the download URL and checksum of every tool below.
lockfile = true

[tools]
java = "temurin-21.0.13+9.0.LTS"
python = "3.13.18"
node = "24.22.3"
uv = "0.13.10"
"pipx:reuse" = "6.3.0"
"npm:prettier" = "3.10.1"
gitleaks = "8.30.1"
zizmor = "1.33.1"
bazelisk = "1.30.0"
buildifier = "10.2.0"
ruff = "0.17.6"
shellcheck = "0.11.0"
actionlint = "1.7.12"
taplo = "0.10.0"
typos = "1.52.2"
committed = "1.1.12"
# Decision records: MADR 4.0.0 files managed and checked by adrs (`anima-repository-conventions`).
"github:joshrotenberg/adrs" = "0.13.0"
jq = "1.8.2"
# The backlog: work to do, one file per task (`anima-working-as-an-agent`).
"github:MrLesk/Backlog.md" = { version = "1.57.4", rename_exe = "backlog" }

[env]
# uv must use the Python pinned above, never one it downloads itself.
UV_PYTHON_PREFERENCE = "only-system"
# Everything generated or cached lives in .cache/, the one ignored directory.
UV_PROJECT_ENVIRONMENT = "{{config_root}}/.cache/venv"
PYTHONPYCACHEPREFIX = "{{config_root}}/.cache/pycache"
RUFF_CACHE_DIR = "{{config_root}}/.cache/ruff"
# adrs reads this file and does not let a user-level configuration change the
# result of a check (adrs.toml states every key).
ADRS_CONFIG = "{{config_root}}/adrs.toml"
# OMG SysML v2 Pilot Implementation, the validator of model/*.sysml.
SYSML_PILOT_RELEASE = "2026-09.1"
SYSML_PILOT_VERSION = "0.63.1"
SYSML_PILOT_SHA256 = "2ab938037b8d3a02a3518019b6e81b356a994f4a5214727bfedcfd64bad25415"

# model:check and model:export are file tasks in mise-tasks/model/;
# generate and generate:check are file tasks in mise-tasks/generate/.

[tasks."licenses:check"]
description = "Check that every file carries copyright and licence information (REUSE)"
run = "reuse lint"

[tasks."adr:check"]
description = "Check the decision records: sections, status, dates, numbering, links (adrs doctor)"
run = "adrs doctor --warnings-as-errors"

[tasks."secrets:check"]
description = "Scan the repository for committed secrets"
run = "gitleaks git --no-banner --redact"

[tasks."workflows:check"]
description = "Analyse the GitHub Actions workflows (syntax, permissions, injection, unpinned actions)"
run = ["actionlint", "zizmor --offline .github/workflows"]

[tasks.lint]
description = "Lint and check the formatting of Anima's own files"
run = [
  "ruff check .",
  "ruff format --check .",
  "shellcheck mise-tasks/model/check mise-tasks/model/export",
  # Listed by name: `-r .` would descend into the forks.
  "buildifier -mode=check -lint=warn MODULE.bazel BUILD.bazel",
  "prettier --check .",
  "taplo fmt --check",
  "typos",
]

[tasks.format]
description = "Write the generated files, then format Anima's own files"
depends = ["generate"]
run = [
  "ruff format .",
  "buildifier MODULE.bazel BUILD.bazel",
  "prettier --write .",
  "taplo fmt",
]

[tasks.build]
description = "Build Anima's own code with Bazel"
run = "bazelisk build //..."

[tasks.test]
description = "Run the automated verifications"
run = "uv run --locked pytest"

[tasks.check]
description = "Run every check"
depends = [
  "model:check",
  "generate:check",
  "adr:check",
  "licenses:check",
  "secrets:check",
  "workflows:check",
  "lint",
  "build",
  "test",
]

[tasks."promote:verify"]
description = "Everything a commit of main must pass to be promoted to main-green"
# The long suites (system tests, upstream regression, hardening) join here.
depends = ["check"]

# ---- Git hooks, installed by `mise run hooks:install` -----------------------

[tasks."pre-commit"]
description = "Git pre-commit hook: the fast checks"
depends = ["lint", "adr:check", "licenses:check", "workflows:check"]

[tasks."commit-msg"]
description = "Git commit-msg hook: the message follows Conventional Commits"
run = "committed --commit-file"

[tasks."pre-push"]
description = "Git pre-push hook: every check"
depends = ["check"]

[tasks."hooks:install"]
description = "Install the git hooks that run the three tasks above"
run = [
  "mise generate git-pre-commit --write --hook pre-commit --task pre-commit",
  "mise generate git-pre-commit --write --hook commit-msg --task commit-msg",
  "mise generate git-pre-commit --write --hook pre-push --task pre-push",
]
