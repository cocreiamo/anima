[[gap]]
id = "GAP-052"
component = "terraform-provider-keycloak"
version = "5.11.0, 2026-11-27"
summary = "The provider persists the generated secret of a confidential client in the state, also with the signed-token client authenticator, unless the write-only attribute `client_secret_wo` is used; the state then holds an empty value."
impact = "A client declared without the write-only attribute would put a secret into the state (R7)."
workaround = "Every confidential client sets `client_secret_wo` (`engine/configure/declarations/identities.tf`); a test of the decrypted state checks that it holds no secret."
upstream = "not reported"
resolved_when = "The provider does not persist a generated client secret, or a check refuses a confidential client without the write-only attribute."
status = "open"

