name: Mirror base images

# Copies every image of the register (`components.toml`: the entries with an
# `image`) into the organization's mirror, so that a pinned digest cannot vanish
# when the upstream registry deletes its manifest (GAP-060, TASK-43). For each
# image it copies the pinned digest and the digest that the upstream tag names
# now, whole (every platform) and with the digest preserved: a copy that cannot
# keep the digest, or whose result differs, fails the job. Each copy is reachable
# by two tags that are never moved: `sha256-<hex>` is the digest itself, and
# `<tag>-<UTC date>` is the day's copy of the upstream tag. Nothing is deleted.
#
# The list of images is read from the register, never written here. Every step
# is one call to a command of the repository that has a test that runs it
# (`mise-tasks/ci/`, `tests/ci/`, R168): the plan is `ci:mirror-plan`, the copy
# of one image is `ci:mirror-copy`. The job that may write packages holds nothing
# else, runs no tool of the repository (none is installed) and no code but that
# one command, and runs a pinned image of the copy tool (R163).
# The builds do not pull from the mirror yet (anima-adopting-a-component).
#
# The upstream rebuild of the engine's base happens around 11:30 UTC (observed
# on 2026-11-28), so the copy runs after it.
#
# Unverified: this workflow has never run. A package is created private by the
# first push; its visibility, and that this repository may write to it, are the
# founder's to settle before and after the first run.

on:
  schedule:
    - cron: "17 13 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: mirror-base-images
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      images: ${{ steps.register.outputs.images }}
      skopeo: ${{ steps.register.outputs.skopeo }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          version: 2026.11.14
          install_args: python
          cache: false
      - id: register
        name: Read the images and the copy tool from the register
        env:
          MISE_TASK_RUN_AUTO_INSTALL: "false"
        run: mise run ci:mirror-plan

  mirror:
    name: Mirror ${{ matrix.name }}
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJSON(needs.plan.outputs.images) }}
    env:
      SKOPEO: ${{ needs.plan.outputs.skopeo }}
      NAME: ${{ matrix.name }}
      IMAGE: ${{ matrix.image }}
      TAG: ${{ matrix.tag }}
      DIGEST: ${{ matrix.digest }}
      MIRROR: ${{ matrix.mirror }}
      # No tool of the repository is installed in the job that holds the token.
      MISE_TASK_RUN_AUTO_INSTALL: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          version: 2026.11.14
          install: false
          cache: false
      - name: Copy the digest that the upstream tag names now, then the pinned digest
        env:
          REGISTRY_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: mise run ci:mirror-copy
