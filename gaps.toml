[[gap]]
id = "GAP-054"
component = "podman"
version = "6.2, nested in the engine image, 2026-11-27"
summary = "Concurrent starts of containers into one pod, together with the cleanup of an exiting container, hung the nested podman (a futex wait)."
impact = "The engine's containers cannot start at the same time: a hang is a failed start that no check names."
workaround = "The starts are ordered, the identity provider last, and run-to-completion units retry (`engine/access/access.container`, `engine/database/database-prepare.container`)."
