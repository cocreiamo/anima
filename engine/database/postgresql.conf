# Anima database server configuration (this slice: no access rules yet).
listen_addresses = '127.0.0.1'
port = 5432
unix_socket_directories = '/run/postgresql'
hba_file = '/etc/anima/database/pg_hba.conf'
ident_file = '/etc/anima/database/pg_ident.conf'
data_directory = '/var/lib/postgresql/data/cluster'
password_encryption = scram-sha-256
shared_preload_libraries = 'pg_oidc_validator'
oauth_validator_libraries = 'pg_oidc_validator'
# The identity of a session: the username claim, which people and applications both
# carry (an application has no e-mail address).
pg_oidc_validator.authn_field = 'preferred_username'
# Where the validator reads the provider's discovery document and keys: rendered
# with the access rules, from the declaration of the provider's addresses (tokenValidatorReachesProviderOverLoopback).
include = '/etc/anima/database/validator.conf'
log_destination = 'stderr'
log_connections = on

# Turned on by a reload, never needed to start: the certificate step writes this
# file when the secret store has issued the server's certificate (R61, R15).
include_if_exists = '/run/anima/pgtls/ssl.conf'

# The listen address is written at every start for the way the engine runs
# (anima-listen); the default above is the closed one, for a missing file.
include_if_exists = '/run/anima/listen/database.conf'
