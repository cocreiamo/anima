name: Sync forks

# Fast-forwards the upstream branches mirrored in each fork (`anima-maintaining-a-fork`).
# Needs the secret FORK_SYNC_TOKEN: a token that can write to the forks. The one
# step calls a command of the repository that has a test that runs it
# (`mise-tasks/ci/`, `tests/ci/`, R170); no tool is installed in the job.

on:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  sync:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - {
              fork: cocreiamo/anima-postgres,
              upstream: postgres/postgres,
              branch: master,
            }
          - {
              fork: cocreiamo/anima-postgres,
              upstream: postgres/postgres,
              branch: REL_18_STABLE,
            }
          - {
              fork: cocreiamo/anima-keycloak,
              upstream: keycloak/keycloak,
              branch: main,
            }
          - {
              fork: cocreiamo/anima-keycloak,
              upstream: keycloak/keycloak,
              branch: release/26.8,
            }
          - {
              fork: cocreiamo/anima-pg-oidc-validator,
              upstream: percona/pg_oidc_validator,
              branch: main,
            }
          - {
              fork: cocreiamo/anima-pgvector,
              upstream: pgvector/pgvector,
              branch: master,
            }
          - {
              fork: cocreiamo/anima-pgbackrest,
              upstream: pgbackrest/pgbackrest,
              branch: main,
            }
          - {
              fork: cocreiamo/anima-openbao,
              upstream: openbao/openbao,
              branch: main,
            }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@3277a0f272901982804abc53abd93520db809be4 # v5.4.0
        with:
          version: 2026.11.14
          install: false
          cache: false
      - run: mise run ci:sync-fork "$FORK" "$UPSTREAM" "$BRANCH"
        env:
          GH_TOKEN: ${{ secrets.FORK_SYNC_TOKEN }}
          MISE_TASK_RUN_AUTO_INSTALL: "false"
          FORK: ${{ matrix.fork }}
          UPSTREAM: ${{ matrix.upstream }}
          BRANCH: ${{ matrix.branch }}
