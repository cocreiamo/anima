# ------------------------------------------------------------- proposal
#
# Default envelopes, to be decided by the founder and applied by the next wave:
# a memory limit through `Memory=` of the container unit (so that the runtime
# sees it), a CPU bound through `CPUQuota=` of the service, a task limit through
# `PidsLimit=`. The figures are ceilings, not reservations: the engine uses
# about a third of them when idle (engine total measured current 1071 MiB).
# Rule of the numbers: the measured peak times a margin of 2 to 3 for a unit
# that is small and steady; upstream's documented sizing where it exists; an
# estimate from the unit's own settings where the measurement is of an idle
# engine (the database), marked `estimate`, to be checked by a load test.

[[proposal]]
unit = "access"
memory_mib = 2048
memory_basis = "upstream recommends 2 GB for smaller production deployments (the formula of its sizing guide gives 1360 MB for 10000 cached sessions); the heap then ends at 70 %, 1433 MiB, and 256 MiB of metaspace and about 300 MB outside the heap fit in the rest; measured steady use 778 MiB"
cpu_quota_percent = 200
cpu_basis = "upstream: 1 vCPU per 15 password logins per second, so 2 vCPU carry 30 a second; the start needs CPU (109 CPU seconds under a load of 17, uncapped)"
tasks = 256
tasks_basis = "measured peak 103, times 2.5; the JVM's thread count grows with the CPUs it sees"
native = "none: with Memory= the heap follows the limit (MaxRAMPercentage=70); an adopter who sets more writes it in the configuration"

[[proposal]]
unit = "database"
memory_mib = 768
memory_basis = "estimate: shared_buffers 160 MiB + 3 autovacuum workers at 64 MiB maintenance_work_mem + 100 connections at about 4 MiB of work_mem each, rounded up; measured 136 MiB peak on an idle engine"
cpu_quota_percent = 200
cpu_basis = "upstream's sizing guide for the identity provider's database: 0.35 to 0.7 vCPU per the workload that 2 vCPU of the identity provider produce; measured idle use 0.5 %"
tasks = 160
tasks_basis = "100 connections plus the background processes (measured peak 28 on an idle engine)"
native = "none now; shared_buffers stays at its default so that it follows the limit only by hand"

[[proposal]]
unit = "secrets"
memory_mib = 256
memory_basis = "measured peak 117 MiB times 2.2"
cpu_quota_percent = 100
cpu_basis = "idle use is 3.7 % of one CPU; one CPU is generous for one node"
tasks = 128
tasks_basis = "measured peak 50, times 2.5"
native = "GOMEMLIMIT=200MiB (80 % of the limit, so that the Go runtime collects before the kill)"

[[proposal]]
unit = "entry"
memory_mib = 256
memory_basis = "measured peak 98 MiB times 2.6; the runtime's documented default heap hard limit inside a limited container is 75 %, 192 MiB, which needs no setting"
cpu_quota_percent = 100
cpu_basis = "a proxy with 0.4 % idle use; one CPU"
tasks = 128
tasks_basis = "measured peak 31, times 4 (thread pool grows with load)"
native = "none (the runtime reads the container limit)"

[[proposal]]
unit = "database-tls"
memory_mib = 64
memory_basis = "measured peak 26 MiB times 2.5"
cpu_quota_percent = 25
cpu_basis = "0.1 % idle use"
tasks = 32
tasks_basis = "measured peak 24"
native = "none"

[[proposal]]
unit = "mail"
memory_mib = 128
memory_basis = "measured peak 53 MiB times 2.4; a stand-in, only with the catcher driver, counted separately"
cpu_quota_percent = 50
cpu_basis = "0.3 % idle use"
tasks = 64
tasks_basis = "measured peak 37"
native = "GOMEMLIMIT=100MiB"

[[proposal]]
unit = "configure"
memory_mib = 512
memory_basis = "measured peak 297 MiB times 1.7; it runs while everything else is up, so it counts in the engine total at start"
cpu_quota_percent = 200
cpu_basis = "8.6 CPU seconds in a start of about two minutes, mostly one process"
tasks = 256
tasks_basis = "not measured (a one-shot's pids.peak is gone with its cgroup); the declaration tool starts one process per provider"
native = "GOMEMLIMIT=400MiB"

[[proposal]]
unit = "database-init"
memory_mib = 256
memory_basis = "measured peak 104 MiB times 2.5; only when the volume is empty, before anything else"
cpu_quota_percent = 100
cpu_basis = "1.2 CPU seconds"
tasks = 64
tasks_basis = "initdb starts one process at a time; estimate"
native = "none"

[[proposal]]
unit = "database-prepare"
memory_mib = 128
memory_basis = "measured peak 33 MiB times 3.8 (a client)"
cpu_quota_percent = 50
cpu_basis = "0.2 CPU seconds"
tasks = 32
