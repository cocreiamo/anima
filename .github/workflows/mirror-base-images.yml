name: Mirror base images

# Copies every image of the register (`components.toml`: the entries with an
# `image`) into the organization's mirror, so that a pinned digest cannot vanish
# when the upstream registry deletes its manifest (GAP-060, TASK-43). For each
# image it copies the pinned digest and the digest that the upstream tag names
# now, whole (every platform) and with the digest preserved: a copy that cannot
# keep the digest, or whose result differs, fails the job. Each copy is reachable
# by two tags that are never moved: `sha256-<hex>` is the digest itself, and
# `<tag>-<UTC date>` is the day's copy of the upstream tag; the tag that is the
# upstream tag itself follows it, once the digest is held, because the update bot
# reads the digest of a tag and must find only digests that the mirror holds.
# Nothing is deleted.
#
# The list of images is read from the register (each entry's `source` is copied
# into its `image`, the package of the mirror), never written here. Every step
# is one call to a command of the repository that has a test that runs it
# (`mise-tasks/ci/`, `tests/ci/`, R170): the plan is `ci:mirror-plan`, the copy
# of one image is `ci:mirror-copy`. The job that may write packages holds nothing
# else, runs no tool of the repository (none is installed) and no code but that
# one command, and runs a pinned image of the copy tool (R163).
# The builds pull from the mirror (R164). This workflow is the exception: it reads
# upstream, and its copy tool is pulled from upstream too, since it runs before the
# mirror holds anything (anima-adopting-a-component, rule 13).
#
# The upstream rebuild of the engine's base happens around 11:30 UTC (observed
# on 2026-11-28), so the copy runs after it.
#
# The builds read the mirror without credentials, so its packages must be public
# (all 13 were on 2026-11-28); the last job checks that the mirror holds every pin
# of the register, read that way (requirement mirrorHoldsEveryPin).

on:
  schedule:
    - cron: "17 13 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: mirror-base-images
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      images: ${{ steps.register.outputs.images }}
      skopeo: ${{ steps.register.outputs.skopeo }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          version: 2026.11.14
          install_args: python
          cache: false
      - id: register
        name: Read the images and the copy tool from the register
        env:
          MISE_TASK_RUN_AUTO_INSTALL: "false"
        run: mise run --quiet ci:mirror-plan >> "$GITHUB_OUTPUT"

  mirror:
    name: Mirror ${{ matrix.name }}
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJSON(needs.plan.outputs.images) }}
    env:
      SKOPEO: ${{ needs.plan.outputs.skopeo }}
      NAME: ${{ matrix.name }}
      IMAGE: ${{ matrix.image }}
      TAG: ${{ matrix.tag }}
      DIGEST: ${{ matrix.digest }}
      MIRROR: ${{ matrix.mirror }}
      # No tool of the repository is installed in the job that holds the token.
      MISE_TASK_RUN_AUTO_INSTALL: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          version: 2026.11.14
          install: false
          cache: false
      - name: Copy the digest that the upstream tag names now, then the pinned digest
        env:
          REGISTRY_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: mise run ci:mirror-copy

  check:
    # After the copies: the mirror holds every pin of the register, read without
    # credentials as a build reads it (requirement mirrorHoldsEveryPin). It holds no write permission and
    # fails loudly here rather than as a refusal in the middle of a build.
    name: Check the mirror holds every pin
    needs: mirror
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          version: 2026.11.14
          install_args: python
          cache: false
      - name: Check that the mirror holds every pin of the register
        env:
          MISE_TASK_RUN_AUTO_INSTALL: "false"
        run: mise run ci:mirror-check
