name: System tests

# Runs `mise run engine:test` (the engine image started as a container) on a
# GitHub-hosted runner, on pull requests and in the merge queue, and on `main`
# to keep the cache of the inner images. It provides one check, "System tests",
# which reports on every change: a change that touches nothing of the engine
# passes without work (`anima-tech-github-governance`, rule 2), so the check
# can be required. Only the promotion builds an image that is released
# (`anima-branching-and-releasing`, rules 4 and 6).

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: system-tests-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  system-tests:
    name: System tests
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
    env:
      # The paths that the engine image and its tests are made of.
      RELEVANT: '^(engine/|third_party/|config/|tests/system/|mise-tasks/engine/|mise-tasks/promote/|tests/promote/|\.gitmodules$|components\.toml$|\.github/workflows/(system-tests|promote)\.yml$)'
    steps:
      - id: changes
        name: Decide whether the change touches the engine
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
        run: |
          set -euo pipefail
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            echo "No base to compare with: the change counts as relevant."
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          gh api --paginate "repos/$GITHUB_REPOSITORY/compare/$BASE...$HEAD" \
            --jq '.files[] | .filename, (.previous_filename // empty)' > "$RUNNER_TEMP/changed.txt"
          if grep -Eq "$RELEVANT" "$RUNNER_TEMP/changed.txt"; then
            echo "The change touches the engine ($EVENT):"
            grep -E "$RELEVANT" "$RUNNER_TEMP/changed.txt"
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "The change touches nothing of the engine: nothing to run."
            echo "relevant=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.changes.outputs.relevant == 'true'
        with:
          submodules: true
          persist-credentials: false

      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        if: steps.changes.outputs.relevant == 'true'
        with:
          version: 2026.11.14

      - id: key
        name: Compute the key of the inner images
        if: steps.changes.outputs.relevant == 'true'
        run: |
          echo "value=$( { git submodule status; find engine mise-tasks/engine config -type f | LC_ALL=C sort | xargs sha256sum; } | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

      - id: restore
        name: Restore the inner images
        if: steps.changes.outputs.relevant == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/engine-cache
          key: system-tests-engine-${{ steps.key.outputs.value }}
          restore-keys: system-tests-engine-

      - name: Load the restored images
        if: steps.changes.outputs.relevant == 'true' && steps.restore.outputs.cache-matched-key != ''
        run: |
          podman load --input ~/engine-cache/images.tar
          # `podman save` refuses to write over an existing archive, and a new one
          # is saved when the key does not hold the current images.
          rm -f ~/engine-cache/images.tar

      # The commands that the promotion workflow calls, run against real podman
      # and a throwaway registry (R170, R171, PM-014); they pull small images
      # and never touch the engine image.
      - name: Run the commands of the promotion
        if: steps.changes.outputs.relevant == 'true'
        run: mise run promote:test

      - name: Build the engine image
        if: steps.changes.outputs.relevant == 'true'
        run: |
          mise run engine:image
          mise run engine:build database-test-client

      - id: pack
        name: Save the inner images as one archive
        if: steps.changes.outputs.relevant == 'true' && github.event_name == 'push' && steps.restore.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/engine-cache
          refs=$(cat .cache/engine/{configure,database,database-test-client,access,secrets,mail}.ref)
          # shellcheck disable=SC2086
          podman save --multi-image-archive --output ~/engine-cache/images.tar $refs

      - name: Cache the inner images
        if: steps.changes.outputs.relevant == 'true' && github.event_name == 'push' && steps.pack.outcome == 'success'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/engine-cache
          key: system-tests-engine-${{ steps.key.outputs.value }}

      - name: Run the system tests
        if: steps.changes.outputs.relevant == 'true'
        run: mise run engine:test

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure() && steps.changes.outputs.relevant == 'true'
        with:
          name: engine-logs
          path: .cache/engine/logs
          if-no-files-found: ignore
