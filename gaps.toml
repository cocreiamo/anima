[[gap]]
id = "GAP-055"
component = "podman"
version = "4.9.3 on the host, 2026-11-27"
summary = "`podman wait --condition=healthy` returns at once with -1 on this version instead of waiting for the container to be healthy."
impact = "A script or a test that waits for health with that command goes on at once; the engine's wait task reads the health state instead."
workaround = "Poll the health state (`mise-tasks/engine/wait`)."
upstream = "not reported"
resolved_when = "The command waits on the host's supported podman versions, or the engine documents a minimum host version that has it."
status = "open"

[[gap]]
id = "GAP-056"
component = "podman"
version = "4.9.3 on the host and on the hosted runner, 2026-11-28"
summary = "After a kill or stop whose wait for the exit file times out (5 s, answer 125), podman reports the container as stopped (ExitCode -1) before the previous run has finished; a start issued then answers 0 and is undone when the previous run's exit file is applied to the new run, which ends exited 137. The collision of the health-check timer unit name (`Unit <id>.timer was already loaded`) was fixed upstream in 5.1 (PR #22589); the late exit file is not shown fixed."
impact = "A test or script that starts a container right after a kill under load can find it stopped for good although the start succeeded (R42)."
workaround = "Treat only Status `exited` as a finished stop and start again only then, or after `podman wait --condition exited` (`container_phase` in `tests/system/engine_logic.py`, `Engine.kill` and `Engine.stop` in `tests/system/conftest.py`). Unverified: whether a container managed by a Quadlet unit, which is a new container at each start, is exposed."
upstream = "not reported"
resolved_when = "A podman release is shown not to apply a late exit to a new run of the same container."
status = "open"

[[gap]]
id = "GAP-057"
component = "yarp"
version = "2.3.0, 2026-11-28"
summary = "The HTTP entry point (ADR 0008) is not built from source in a fork of ours. The .NET runtime and SDK come from a distribution's packages (the distribution builds them from source; building them from a fork is impractical), and YARP comes from its NuGet package, pinned by version and by the content hash of the package. A mirror fork of YARP for upstream contributions is planned and does not exist yet."
impact = "An exception to building every component from source (`anima-maintaining-a-fork`): the library that the entry runs is a binary package whose build we do not reproduce, and a change of ours to it has no fork to be written in."
workaround = "The build of the entry (`engine/entry/Containerfile`) downloads the package, refuses it unless the SHA-256 of the file is the one of components.toml, and restores from a lock file (`engine/entry/packages.lock.json`) that pins the content hash of every package; the distribution's packages are pinned by version and the base image by digest, and a test compares the container file with the register (`tests/system/test_entry_static.py`). Observed on 2026-11-28: the image builds, and a build with a wrong hash fails at the check (sha256sum prints FAILED and says 1 computed checksum did NOT match). Not covered: the base image's digest is deleted by the registry about a day after the next daily rebuild (spike of 2026-11-28), so the pin of `fedora-minimal` stops resolving; a mirror of the base images is being built elsewhere and covers the register entry."
upstream = "not reported"
resolved_when = "The mirror fork of YARP exists and the entry's build compiles the library from the fork's pinned commit, or the founder records that the NuGet package stays the way the library is taken."
status = "open"

[[gap]]
id = "GAP-058"
component = "yarp"
version = "2.3.0, 2026-11-28"
summary = "The application that the YARP project packages is preview only (not marked as shipping), so the entry runs a minimal host program of ours that loads the library and its configuration."
impact = "A program of ours to maintain, in the engine, that upstream would otherwise ship (`anima-adopting-a-component`, rule 2)."
workaround = "The host program (`engine/entry/Program.cs`) is a few lines: it loads the library and its configuration. It holds no route and no TLS setting (the routes are `engine/entry/appsettings.json`, the listener and certificate settings are the entry's unit); the one decision in its code is the list of path segments that are never forwarded (R129)."
upstream = "not reported"
resolved_when = "Upstream ships a stable application that is configured by files and carries what the entry needs (TLS from files, header transforms, routes), and the entry runs it instead of our host program."
status = "open"

[[gap]]
id = "GAP-059"
component = "yarp"
version = "2.3.0, 2026-11-28"
summary = "YARP had no stable release for about 21 months at 2026-11-28 (last stable release 2025-02-27), while its main branch was active."
impact = "The entry depends on a library whose release cadence is a governance risk: a fix or a security update may not reach a stable release soon, and the project's plans are not known to us."
workaround = "The package is pinned; the mirror fork (GAP-057) is the place to carry a fix of ours until a release has it."
upstream = "not reported"
resolved_when = "YARP has made a stable release after 2026-11-28 and has kept a regular release cadence for a year, or the entry has moved to another library behind the same port."
status = "open"

[[gap]]
id = "GAP-060"
component = "container registries (quay.io and the other upstream registries of the base images)"
version = "observed 2026-11-28"
summary = "The registry of the engine image's base rebuilds its tag daily, around 11:30 UTC, and deletes the previous manifest within hours, so a digest pin lives about a day: on 2026-11-28 the pin on main answered \"manifest unknown\" and broke every build from scratch; the distribution's minimal image behaves the same. The other base images resolved that day (UBI, UBI micro, Debian, Alpine, the Java toolchain, the Go toolchain, the mail catcher, the configurator's image), but none of their registries promises how long a manifest is kept."
impact = "A digest pin does not make a build rebuildable (TASK-43): a build from scratch fails when the manifest it pins is gone, and the update bot proposes a digest that may be gone by the time it is merged."
workaround = ".github/workflows/mirror-base-images.yml (R160 to R163) copies the pinned digest and the current tag's digest of every registered image into the organization's mirror, with the digest preserved. The builds do not pull from the mirror yet (TASK-96): until they do, the pin of the engine image's base must be bumped daily."
upstream = "not reported"
resolved_when = "Every build of the engine pulls its base images from the mirror by the digest the mirror holds, and the update bot proposes only digests that exist there (R164)."
status = "open"

[[gap]]
id = "GAP-061"
component = "pg_oidc_validator"
version = "1.1.0, read in the pinned source 2026-11-28"
summary = "The validator has no setting for a trust anchor: it fetches the discovery document and the keys with libcurl and its compiled-in system store, and the library does not read the CA-file environment variable. The engine's own certificate authority therefore cannot be given to it, so it cannot fetch over the entry (TLS with the engine authority's certificate)."
impact = "The validator cannot use the public URL, which is the entry's. The engine works around it with an internal channel."
workaround = "The validator fetches over the pod's loopback from the identity provider directly (`pg_oidc_validator.discovery_url_override`, rendered next to the access rules), and the provider publishes back-channel URLs that follow the request (`--hostname-backchannel-dynamic`), so the keys are fetched there too (tokenValidatorReachesProviderOverLoopback). The issuer stays the public URL. Token logins do not depend on the entry."
upstream = "not reported"
resolved_when = "The validator accepts a setting that names a certificate authority file (TASK-97), and the engine may give it the engine authority's certificate."
status = "open"
