# ------------------------------------------------------------- what an adopter is told

[adopter]
# Derived by R204 from engine/image/envelopes.toml: the sum of the limits of the
# units that run at the same time plus the allowance for the operating system. The
# adopter's guide takes the sentence below; it is the one place of the fact.
default_engine_memory_mib = 2688
floor_engine_memory_mib = 1792
statement = "An engine needs about 2.7 GiB of memory by default for low traffic (at least 1.8 GiB at the floor of every service) and two processor cores, the largest bound of one service; below that it is not supported. A bigger machine gives room by an override in the configuration (table `resources` of the capability), never by default."

# ------------------------------------------------- the engine, after the envelopes

[measurement_after]
date = "2026-11-28"
machine = "the same shared development machine, load average 8.5 to 10.8 during the run (lower than before: the time to ready is not comparable to the first measurement)"
engine_image = "built on the branch of the envelopes; the inner images are those built from the same pinned sources by another worktree, with the database server's configuration files laid over them (no fork was checked out here)"
method = "as in [measurement]: systemctl show per unit at the moment the engine reported healthy, memory.stat of the outer container's cgroup; image-load units read the same way"
time_to_ready_seconds = 156
time_to_ready_note = "three starts on this machine took 86, 156 and 240 s (the 240 s one was the unmodified engine with only a limit of 768 MiB on the identity provider, with the load at 10 to 20); not a result of the change"
engine_total_memory_current_mib = 1240
engine_total_memory_peak_mib = 2184
engine_total_note = "the outer container's cgroup includes the page cache of the image archives (file 671 MiB at the reading; anon 495 MiB, kernel 73 MiB); before: current 1071, peak 3252, the peak being the unbounded heap of the identity provider"
image_load_note = "the units that load an image archive reached their limit of the class (access-image and entry-image at 512 MiB) through page cache, which is reclaimable, and none was killed; the class is the one to watch if an archive grows"
at_the_limit = "observed on 2026-11-28: the entry given 4 MiB was killed by the kernel at its limit within seconds of each start, the init system logged it, the unit restarted it, reached its start limit after three tries and stayed failed; the engine said not ready, named the unit and the cause; the database server, the secret store, the identity provider and the certificate renewal were not restarted"
identity_provider = "see skills/anima-tech-keycloak.md rule 19; measured on 2026-11-28 with a first-start engine: defaults at 768 MiB with 2 CPUs: current 546, peak 569, ready 160 s under load; serial collector and first tier only at 768: current 441; plus local caches and pools of 10 connections and 20 threads: 352; at 640 MiB with the final options: 392 to 447 after the configurator's run; at 512 MiB: 392 to 425, held, headroom about 90 MiB, the floor; `stateless` feature: anon 384 MiB against 355 without it, no gain; sessions without caches: no change"
